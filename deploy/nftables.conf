#!/usr/sbin/nft -f
# Pare-feu du CT Abysse : port 80 pour le réseau local et le VPN, SSH pour le réseau local seulement.
# Abysse n'a pas de mot de passe : ne jamais ouvrir le port 80 sur internet.
# Adapter les deux listes ci-dessous à son réseau avant d'appliquer.
flush ruleset
table inet filtre {
  set reseaux_autorises { type ipv4_addr; flags interval; elements = { 192.168.10.0/24, 10.8.0.0/24 } }
  set reseau_admin { type ipv4_addr; flags interval; elements = { 192.168.10.0/24 } }
  chain entree {
    type filter hook input priority 0; policy drop;
    iif lo accept
    ct state established,related accept
    ct state invalid drop
    ip protocol icmp accept
    meta l4proto ipv6-icmp accept
    tcp dport 80 ip saddr @reseaux_autorises accept
    tcp dport 22 ip saddr @reseau_admin accept
  }
  chain transfert { type filter hook forward priority 0; policy drop; }
  chain sortie { type filter hook output priority 0; policy accept; }
}
